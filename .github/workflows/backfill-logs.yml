name: Copy logs from Neon to D1

# One-off, run by hand (Actions → "Copy logs from Neon to D1" → Run workflow) once
# Neon is reachable again. Copies the log history that was written to Neon before
# the logs moved to D1. Safe to re-run: rows already in D1 are skipped.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of supplier / email logs to copy
        default: "90"

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Export from Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          mkdir -p backfill
          export_table() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "select row_to_json(t) from ($2) t" \
              | node ../../packages/db/scripts/logs-backfill-sql.mjs "$1" > "backfill/$1.sql"
            echo "$1: $(wc -l < "backfill/$1.sql") rows"
          }
          export_table supplier_api_logs  "select * from supplier_api_logs where created_at > now() - interval '$DAYS days'"
          export_table email_logs         "select * from email_logs where created_at > now() - interval '$DAYS days'"
          export_table supplier_exchanges "select * from supplier_exchanges"
          export_table agent_activity_daily "select agent_id, day::text as day, tenant_id, searches, checkouts from agent_activity_daily"
      - name: Import into D1
        run: |
          set -euo pipefail
          id="$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == "poomas-logs") | .uuid' | head -n1)"
          [ -n "$id" ] || { echo "The poomas-logs D1 database does not exist yet: deploy the API first."; exit 1; }
          sed -i "s/^database_id    = .*/database_id    = \"$id\"/" wrangler.toml
          for f in backfill/*.sql; do
            if [ -s "$f" ]; then pnpm exec wrangler d1 execute poomas-logs --remote --file "$f"; fi
          done
